services:
  postgres:
    image: postgres:16
    container_name: datamlops-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: datamlops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: air_quality

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamlops -d air_quality"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: